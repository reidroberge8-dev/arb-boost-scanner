name: Boost Scan

# Triggered directly from the mobile page in docs/ (a browser POST to the
# GitHub API's workflow_dispatch endpoint) -- no schedule, no polling,
# purely on-demand. run_id is generated client-side BEFORE the trigger call
# so the page knows exactly which output file to poll for afterward.
#
# The boost LIST itself is never an input to this repo's persistent state --
# it lives only in the mobile page's own browser storage and is sent fresh
# on every dispatch as boosts_json. Nothing about "what boosts are loaded"
# is ever committed here, since this repo is public.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Client-generated correlation ID (output filename)"
        required: true
      mode:
        description: "scan | cash_only"
        required: false
        default: "scan"
      boosts_json:
        description: "JSON array of boost dicts (book/sport/boost_pct/max_wager/min_odds/game/expires), boost_pct as whole-number percent"
        required: false
        default: "[]"
      freebets_json:
        description: "JSON array of free-bet dicts (book/sport/free_bet_amount/min_odds/game/expires)"
        required: false
        default: "[]"
      filter_books_json:
        description: "JSON array of lowercase book names to restrict to (mobile page's book filter chips); [] = no restriction"
        required: false
        default: "[]"
      filter_sports_json:
        description: "JSON array of sport codes to restrict to (mobile page's sport filter chips); [] = no restriction"
        required: false
        default: "[]"
      filter_before_date:
        description: "YYYY-MM-DD global date cutoff (mobile page's own date filter) -- games on/before this date only; '' = no restriction"
        required: false
        default: ""
      use_cash:
        description: "true | false -- whether to cap suggested stakes by live cash-available"
        required: false
        default: "true"
      pending_json:
        description: "JSON object {book: dollars} already committed to open Play Tracker entries -- subtracted from the fresh cash fetch before it caps stake sizing, so a scan doesn't recommend money that's already tied up in a placed-but-unsettled bet"
        required: false
        default: "{}"

# The job needs write access to commit result files back to main --
# GitHub's own auto-issued token for this run, scoped to only this repo,
# never a manually managed secret.
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # a wedged odds-site scrape must not run forever / burn Actions minutes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run boost scan
        env:
          RUN_ID: ${{ github.event.inputs.run_id }}
          MODE: ${{ github.event.inputs.mode }}
          BOOSTS_JSON: ${{ github.event.inputs.boosts_json }}
          FREEBETS_JSON: ${{ github.event.inputs.freebets_json }}
          FILTER_BOOKS_JSON: ${{ github.event.inputs.filter_books_json }}
          FILTER_SPORTS_JSON: ${{ github.event.inputs.filter_sports_json }}
          FILTER_BEFORE_DATE: ${{ github.event.inputs.filter_before_date }}
          USE_CASH: ${{ github.event.inputs.use_cash }}
          PENDING_JSON: ${{ github.event.inputs.pending_json }}
          ARB_BANKROLL_CSV_URL: ${{ secrets.ARB_BANKROLL_CSV_URL }}
        run: python run_boost_scan.py

      - name: Commit result back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/results/*.json
          git commit -m "Boost scan result ${{ github.event.inputs.run_id }}"
          # Rebase onto whatever landed on main since checkout (e.g. a second
          # scan kicked off close behind this one) before pushing, so two
          # near-simultaneous runs don't fail each other's push.
          git pull --rebase origin main
          git push
